name: my third workflow
on: [push,workflow_dispatch]
jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - name: Print working directory
        run: pwd
        
      - name: List all files
        run: ls -a

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: List all files
        run: ls -a

      - name: Print contents of workflow file
        run: cat .github/workflows/my-workflow-3.yml
